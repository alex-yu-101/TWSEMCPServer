services:
  twsemcpserver:
    build: .
    image: twsemcpserver:local
    restart: unless-stopped
    init: true
    env_file:
      - .env
    ports:
      - "127.0.0.1:${PORT:-8000}:${PORT:-8000}"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
